<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>A.I.Mon 홀로그램 UI & 기기 미리보기</title>
<style>
  :root { --holo: #22d3ee; --bg: #0d1017; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; padding: 14px; background: var(--bg); color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow-x: hidden;
  }
  .topbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; z-index: 20; }
  .chip {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    color: #cbd5e1; padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; transition: all 0.2s;
  }
  .chip.active { border-color: var(--holo); color: var(--holo); background: rgba(34,211,238,0.12); box-shadow: 0 0 12px rgba(34,211,238,0.25); }
  .stage { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 16px; width: 100%; max-width: 920px; position: relative; }
  @media (max-width: 720px) { .stage { flex-direction: column; gap: 14px; } }
  .device-wrap { position: relative; width: 290px; height: 290px; flex-shrink: 0; }
  @media (min-width: 721px) { .device-wrap { width: 340px; height: 340px; } }
  .device-img { width: 100%; height: 100%; display: block; border-radius: 20px; pointer-events: none; }
  .btn-layer { position: absolute; inset: 0; cursor: pointer; transition: transform 0.08s ease, filter 0.08s ease; }
  .btn-layer.pressed { transform: scale(0.965) translateY(2px); filter: brightness(0.75); }
  .btn-top-l { clip-path: polygon(35% 8%, 51% 8%, 51% 14%, 35% 14%); }
  .btn-top-r { clip-path: polygon(55% 8%, 69% 8%, 69% 14%, 55% 14%); }
  .btn-left  { clip-path: polygon(22% 52%, 38% 54%, 36% 76%, 22% 73%); }
  .btn-mid   { clip-path: polygon(39% 57%, 61% 57%, 63% 72%, 50% 82%, 37% 72%); }
  .btn-right { clip-path: polygon(62% 54%, 77% 52%, 77% 73%, 64% 76%); }
  .hitbox { position: absolute; cursor: pointer; z-index: 5; border-radius: 12px; }
  .hitbox-top-l { left: 35%; top: 7%; width: 16%; height: 8%; }
  .hitbox-top-r { left: 54%; top: 7%; width: 16%; height: 8%; }
  .hitbox-left  { left: 22%; top: 52%; width: 17%; height: 24%; }
  .hitbox-mid   { left: 39%; top: 57%; width: 22%; height: 25%; }
  .hitbox-right { left: 61%; top: 52%; width: 17%; height: 24%; }
  .lcd-screen {
    position: absolute; left: 31%; top: 22%; width: 37.5%; height: 29%;
    border-radius: 14px 14px 44% 44%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; z-index: 4; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, rgba(34,211,238,0.12), transparent 72%);
  }
  .lcd-icon { font-size: 26px; filter: drop-shadow(0 0 8px var(--holo)); transition: all 0.25s; }
  .lcd-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--holo); margin-top: 4px; text-shadow: 0 0 6px var(--holo); }
  .lcd-dots { display: flex; gap: 4px; margin-top: 5px; }
  .lcd-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.2); }
  .lcd-dot.on { background: var(--holo); box-shadow: 0 0 6px var(--holo); }
  .holo-zone { position: relative; width: 320px; height: 270px; perspective: 1000px; transition: opacity 0.35s ease, transform 0.35s ease; }
  .holo-zone.off { opacity: 0; transform: scale(0.92) translateX(-20px); pointer-events: none; }
  .beam {
    position: absolute; left: -34px; top: 38%; width: 60px; height: 70px;
    background: linear-gradient(90deg, var(--holo), transparent);
    opacity: 0.22; filter: blur(10px); clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 60%); pointer-events: none;
  }
  .stack-wrap { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .holo-card {
    position: absolute; inset: 0; border-radius: 16px; padding: 16px;
    background: linear-gradient(145deg, rgba(13, 25, 38, 0.86), rgba(10, 18, 28, 0.74));
    border: 1.5px solid var(--holo);
    box-shadow: 0 0 22px rgba(34,211,238,0.18), inset 0 0 18px rgba(34,211,238,0.12);
    backdrop-filter: blur(8px);
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease, filter 0.45s ease;
    overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
  }
  .holo-card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 4px);
  }
  .holo-card::after {
    content: ""; position: absolute; left: 0; right: 0; height: 28px; top: -30px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.09), transparent);
    pointer-events: none; z-index: 11; animation: scanSweep 3.8s linear infinite;
  }
  @keyframes scanSweep { 0% { top: -30px; } 100% { top: 110%; } }
  @keyframes glitchJitter {
    0%, 92%, 100% { transform: translate3d(0,0,0) rotateY(-4deg); }
    93% { transform: translate3d(-2px, 0, 0) rotateY(-4deg); }
    95% { transform: translate3d(3px, 1px, 0) rotateY(-4deg); }
    97% { transform: translate3d(-1px, 0, 0) rotateY(-4deg); }
  }
  .holo-card.pos-0 { transform: translate3d(0, 0, 0) rotateY(-4deg) scale(1); opacity: 1; z-index: 4; animation: glitchJitter 5s infinite; }
  .holo-card.pos-1 { transform: translate3d(26px, -6px, -60px) rotateY(-8deg) scale(0.93); opacity: 0.55; z-index: 3; filter: brightness(0.75); pointer-events: none; }
  .holo-card.pos-2 { transform: translate3d(50px, -12px, -120px) rotateY(-12deg) scale(0.86); opacity: 0.30; z-index: 2; filter: brightness(0.55); pointer-events: none; }
  .holo-card.pos-3 { transform: translate3d(72px, -18px, -180px) rotateY(-15deg) scale(0.80); opacity: 0.14; z-index: 1; filter: brightness(0.4); pointer-events: none; }
  .card-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 8px; }
  .card-title { font-weight: 800; font-size: 14px; letter-spacing: 1.5px; color: var(--holo); }
  .card-badge { font-size: 10px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.08); color: #e2e8f0; }
  .card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 10px 0; }
  .room-box { background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; display: flex; justify-content: space-around; align-items: center; }
  .mon { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 24px; animation: bob 1.8s ease-in-out infinite; }
  .mon:nth-child(2) { animation-delay: 0.3s; } .mon:nth-child(3) { animation-delay: 0.6s; } .mon:nth-child(4) { animation-delay: 0.9s; }
  .mon span { font-size: 10px; color: #94a3b8; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .row-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 8px 10px; border-radius: 8px; font-size: 12px; }
  .bar-bg { width: 90px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--holo); border-radius: 99px; }
  .card-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #94a3b8; }
  .hint { margin-top: 14px; font-size: 12px; color: #94a3b8; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <div class="topbar" id="skinBar"></div>
  <div class="stage">
    <div class="device-wrap" id="deviceWrap">
      <img class="device-img" id="baseImg" src="" alt="A.I.Mon Device" />
      <img class="device-img btn-layer btn-top-l" id="layerTopL" src="" alt="" />
      <img class="device-img btn-layer btn-top-r" id="layerTopR" src="" alt="" />
      <img class="device-img btn-layer btn-left"  id="layerLeft" src="" alt="" />
      <img class="device-img btn-layer btn-mid"   id="layerMid"  src="" alt="" />
      <img class="device-img btn-layer btn-right" id="layerRight" src="" alt="" />
      <div class="lcd-screen" id="lcdScreen">
        <div class="lcd-icon" id="lcdIcon">🏠</div>
        <div class="lcd-label" id="lcdLabel">ROOMS</div>
        <div class="lcd-dots" id="lcdDots"></div>
      </div>
      <div class="hitbox hitbox-top-l" onclick="pressBtn('topL', togglePower)" title="홀로그램 ON/OFF"></div>
      <div class="hitbox hitbox-top-r" onclick="pressBtn('topR', nextSkin)" title="스킨 컬러 변경"></div>
      <div class="hitbox hitbox-left"  onclick="pressBtn('left', prevCard)" title="이전 카드"></div>
      <div class="hitbox hitbox-mid"   onclick="pressBtn('mid', triggerAction)" title="선택 / 전환"></div>
      <div class="hitbox hitbox-right" onclick="pressBtn('right', nextCard)" title="다음 카드"></div>
    </div>
    <div class="holo-zone" id="holoZone">
      <div class="beam"></div>
      <div class="stack-wrap" id="stackWrap"></div>
    </div>
  </div>
  <div class="hint">
    기기 버튼을 직접 눌러보세요 · 상단 좌: 홀로그램 ON/OFF · 상단 우: 컬러 스킨<br/>
    하단 좌/우: 3D 스택 카드 회전 · 하단 중앙: 방/항목 전환
  </div>

const skinKeys = Object.keys(SKINS);
let skinIdx = 0, cardIdx = 0, holoOn = true, roomSub = 0;
const rooms = ["작업실 (WORK)", "거실 (LOUNGE)", "침실 (SLEEP)"];
const cards = [
  { id: "ROOMS", icon: "🏠", badge: () => rooms[roomSub],
    body: () => `<div class="room-box"><div class="mon">🫧<span>오이지</span></div><div class="mon">🐻<span>단무지</span></div><div class="mon">🎀<span>석박지</span></div><div class="mon">🦀<span>Claw.D</span></div></div><div class="row-item"><span>현재 공간</span><strong style="color:var(--holo)">${rooms[roomSub]}</strong></div>`,
    foot: "O 버튼: 방 전환 · < >: 메뉴 회전" },
  { id: "MONS", icon: "👾", badge: () => "4 ACTIVE",
    body: () => `<div class="row-item"><span>🫧 오이지 (디자인·비서)</span><span style="color:var(--holo)">● 작업중</span></div><div class="row-item"><span>🦀 Claw.D (개발·코드)</span><span style="color:var(--holo)">● 작업중</span></div><div class="row-item"><span>🐻 단무지 · 🎀 석박지</span><span style="color:#94a3b8">○ 대기</span></div>`,
    foot: "O 버튼: 상태 새로고침" },
  { id: "USAGE", icon: "📊", badge: () => "LIVE",
    body: () => `<div class="row-item"><span>오이지</span><div class="bar-bg"><div class="bar-fill" style="width:68%"></div></div></div><div class="row-item"><span>Claw.D</span><div class="bar-bg"><div class="bar-fill" style="width:52%"></div></div></div><div class="row-item"><span>단무지</span><div class="bar-bg"><div class="bar-fill" style="width:24%"></div></div></div>`,
    foot: "최근 응답 시각 & 활동량" },
  { id: "SETUP", icon: "⚙️", badge: () => SKINS[skinKeys[skinIdx]].name,
    body: () => `<div class="row-item"><span>기기 스킨</span><strong style="color:var(--holo)">${SKINS[skinKeys[skinIdx]].name}</strong></div><div class="row-item"><span>홀로그램 글리치</span><span>ON (주사선 + 흔들림)</span></div><div class="row-item"><span>항상 위 고정</span><span>ON</span></div>`,
    foot: "O 버튼: 스킨 바로 바꾸기" }
];
function applySkin() {
  const s = SKINS[skinKeys[skinIdx]];
  document.documentElement.style.setProperty("--holo", s.holo);
  ["baseImg","layerTopL","layerTopR","layerLeft","layerMid","layerRight"].forEach(id => { document.getElementById(id).src = s.src; });
  document.getElementById("skinBar").innerHTML = skinKeys.map((k, i) => `<button class="chip ${i===skinIdx?"active":""}" onclick="skinIdx=${i};applySkin();renderCards();">${SKINS[k].name}</button>`).join("");
}
function pressBtn(which, fn) {
  const map = { topL:"layerTopL", topR:"layerTopR", left:"layerLeft", mid:"layerMid", right:"layerRight" };
  const el = document.getElementById(map[which]);
  el.classList.add("pressed");
  setTimeout(() => el.classList.remove("pressed"), 110);
  fn();
}
function togglePower() { holoOn = !holoOn; document.getElementById("holoZone").classList.toggle("off", !holoOn); document.getElementById("lcdScreen").style.opacity = holoOn ? "1" : "0.25"; }
function nextSkin() { skinIdx = (skinIdx + 1) % skinKeys.length; applySkin(); renderCards(); }
function nextCard() { cardIdx = (cardIdx + 1) % cards.length; renderCards(); }
function prevCard() { cardIdx = (cardIdx - 1 + cards.length) % cards.length; renderCards(); }
function triggerAction() { if (cardIdx === 0) roomSub = (roomSub + 1) % rooms.length; else if (cardIdx === 3) { nextSkin(); return; } renderCards(); }
function renderCards() {
  const cur = cards[cardIdx];
  document.getElementById("lcdIcon").textContent = cur.icon;
  document.getElementById("lcdLabel").textContent = cur.id;
  document.getElementById("lcdDots").innerHTML = cards.map((_, i) => `<div class="lcd-dot ${i===cardIdx?"on":""}"></div>`).join("");
  document.getElementById("stackWrap").innerHTML = cards.map((c, i) => {
    const pos = (i - cardIdx + cards.length) % cards.length;
    return `<div class="holo-card pos-${pos}"><div class="card-head"><div class="card-title">${c.icon} ${c.id}</div><div class="card-badge">${c.badge()}</div></div><div class="card-body">${c.body()}</div><div class="card-foot"><span>${c.foot}</span><span>${i+1} / ${cards.length}</span></div></div>`;
  }).join("");
}
applySkin(); renderCards();
</script>
</body>
</html>
