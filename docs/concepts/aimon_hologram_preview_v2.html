<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>A.I.Mon v21 LED & 정면 상하 스택 홀로그램 미리보기</title>
<style>
  :root { --holo: #22d3ee; --bg: #0d1017; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; padding: 14px; background: var(--bg); color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow-x: hidden;
  }
  .topbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; z-index: 20; }
  .chip {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    color: #cbd5e1; padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; transition: all 0.2s;
  }
  .chip.active { border-color: var(--holo); color: var(--holo); background: rgba(34,211,238,0.12); box-shadow: 0 0 12px rgba(34,211,238,0.25); }
  .stage { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 18px; width: 100%; max-width: 940px; position: relative; }
  @media (max-width: 740px) { .stage { flex-direction: column; gap: 22px; } }
  .device-wrap { position: relative; width: 290px; height: 290px; flex-shrink: 0; }
  @media (min-width: 741px) { .device-wrap { width: 340px; height: 340px; } }
  .device-img { width: 100%; height: 100%; display: block; border-radius: 20px; pointer-events: none; }
  .btn-layer { position: absolute; inset: 0; cursor: pointer; transition: transform 0.08s ease, filter 0.08s ease; }
  .btn-layer.pressed { transform: scale(0.965) translateY(2px); filter: brightness(0.75); }
  .btn-top-l { clip-path: polygon(35% 8%, 51% 8%, 51% 14%, 35% 14%); }
  .btn-top-r { clip-path: polygon(55% 8%, 69% 8%, 69% 14%, 55% 14%); }
  .btn-left  { clip-path: polygon(22% 52%, 38% 54%, 36% 76%, 22% 73%); }
  .btn-mid   { clip-path: polygon(39% 57%, 61% 57%, 63% 72%, 50% 82%, 37% 72%); }
  .btn-right { clip-path: polygon(62% 54%, 77% 52%, 77% 73%, 64% 76%); }
  .hitbox { position: absolute; cursor: pointer; z-index: 5; border-radius: 12px; }
  .hitbox-top-l { left: 35%; top: 7%; width: 16%; height: 8%; }
  .hitbox-top-r { left: 54%; top: 7%; width: 16%; height: 8%; }
  .hitbox-left  { left: 22%; top: 52%; width: 17%; height: 24%; }
  .hitbox-mid   { left: 39%; top: 57%; width: 22%; height: 25%; }
  .hitbox-right { left: 61%; top: 52%; width: 17%; height: 24%; }
  .lcd-screen {
    position: absolute; left: 31%; top: 22%; width: 37.5%; height: 29%;
    border-radius: 14px 14px 44% 44%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; z-index: 4; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, rgba(34,211,238,0.12), transparent 72%);
  }
  .lcd-icon-img { width: 34px; height: 34px; filter: drop-shadow(0 0 8px var(--holo)); }
  .lcd-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--holo); margin-top: 4px; text-shadow: 0 0 6px var(--holo); }
  .lcd-dots { display: flex; gap: 4px; margin-top: 5px; }
  .lcd-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.2); }
  .lcd-dot.on { background: var(--holo); box-shadow: 0 0 6px var(--holo); }

  /* Straight Front Vertical-Stack Hologram Zone */
  .holo-zone { position: relative; width: 340px; height: 255px; perspective: 1100px; transition: opacity 0.35s ease, transform 0.35s ease; margin-top: 18px; }
  .holo-zone.off { opacity: 0; transform: scale(0.92) translateY(10px); pointer-events: none; }
  .beam-img { position: absolute; left: -92px; top: 0; width: 120px; height: 100%; opacity: 0.7; pointer-events: none; }
  @media (max-width: 740px) { .beam-img { display: none; } }
  .stack-wrap { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .holo-card {
    position: absolute; inset: 0; padding: 14px 18px;
    transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease, filter 0.45s ease;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  .holo-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; z-index: 0; }
  .holo-hdr-img { position: absolute; left: 0; top: 4px; width: 100%; height: 42px; object-fit: fill; pointer-events: none; z-index: 1; }
  .holo-scan-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; z-index: 9; mix-blend-mode: screen; opacity: 0.75; }
  @keyframes glitchJitter {
    0%, 93%, 100% { transform: translate3d(0,0,0) rotateX(0deg) scale(1); }
    94% { transform: translate3d(-2px, 0, 0) rotateX(0deg) scale(1); }
    96% { transform: translate3d(2px, 1px, 0) rotateX(0deg) scale(1); }
    98% { transform: translate3d(-1px, 0, 0) rotateX(0deg) scale(1); }
  }
  /* Vertical Stack: 0 = Straight Front (0deg), 1/2/3 = stacked UPWARD behind */
  .holo-card.pos-0 { transform: translate3d(0, 0, 0) rotateX(0deg) scale(1); opacity: 1; z-index: 4; animation: glitchJitter 5.5s infinite; }
  .holo-card.pos-1 { transform: translate3d(0, -18px, -55px) rotateX(6deg) scale(0.95); opacity: 0.55; z-index: 3; filter: brightness(0.75); pointer-events: none; }
  .holo-card.pos-2 { transform: translate3d(0, -34px, -110px) rotateX(10deg) scale(0.90); opacity: 0.30; z-index: 2; filter: brightness(0.55); pointer-events: none; }
  .holo-card.pos-3 { transform: translate3d(0, -48px, -165px) rotateX(14deg) scale(0.85); opacity: 0.14; z-index: 1; filter: brightness(0.4); pointer-events: none; }
  .card-head { position: relative; z-index: 5; display: flex; justify-content: space-between; align-items: center; height: 34px; }
  .card-title-wrap { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 13px; letter-spacing: 1.5px; color: #a5f3fc; }
  .card-title-wrap img { width: 20px; height: 20px; }
  .card-badge { font-size: 10px; padding: 2px 7px; border-radius: 6px; background: rgba(34,211,238,0.14); color: #cffafe; margin-right: 36px; }
  .card-body { position: relative; z-index: 5; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 7px; padding: 8px 0; }
  .room-box { background: rgba(0,0,0,0.42); border: 1px solid rgba(34,211,238,0.22); border-radius: 10px; padding: 10px; display: flex; justify-content: space-around; align-items: center; }
  .mon { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 22px; animation: bob 1.8s ease-in-out infinite; }
  .mon:nth-child(2) { animation-delay: 0.3s; } .mon:nth-child(3) { animation-delay: 0.6s; } .mon:nth-child(4) { animation-delay: 0.9s; }
  .mon span { font-size: 10px; color: #94a3b8; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .row-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 7px 10px; border-radius: 8px; font-size: 12px; }
  .bar-bg { width: 90px; height: 6px; background: rgba(255,255,255,0.12); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--holo); border-radius: 99px; }
  .card-foot { position: relative; z-index: 5; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #94a3b8; }
  .hint { margin-top: 16px; font-size: 12px; color: #94a3b8; text-align: center; line-height: 1.5; }
</style>
</head>

  <div class="topbar" id="skinBar"></div>
  <div class="stage">
    <div class="device-wrap">
      <img class="device-img" id="baseImg" src="" alt="A.I.Mon Device" />
      <img class="device-img btn-layer btn-top-l" id="layerTopL" src="" alt="" />
      <img class="device-img btn-layer btn-top-r" id="layerTopR" src="" alt="" />
      <img class="device-img btn-layer btn-left"  id="layerLeft" src="" alt="" />
      <img class="device-img btn-layer btn-mid"   id="layerMid"  src="" alt="" />
      <img class="device-img btn-layer btn-right" id="layerRight" src="" alt="" />
      <div class="lcd-screen" id="lcdScreen">
        <img class="lcd-icon-img" id="lcdIcon" src="" alt="" />
        <div class="lcd-label" id="lcdLabel">ROOMS</div>
        <div class="lcd-dots" id="lcdDots"></div>
      </div>
      <div class="hitbox hitbox-top-l" onclick="pressBtn('topL', togglePower)"></div>
      <div class="hitbox hitbox-top-r" onclick="pressBtn('topR', nextSkin)"></div>
      <div class="hitbox hitbox-left"  onclick="pressBtn('left', prevCard)"></div>
      <div class="hitbox hitbox-mid"   onclick="pressBtn('mid', triggerAction)"></div>
      <div class="hitbox hitbox-right" onclick="pressBtn('right', nextCard)"></div>
    </div>
    <div class="holo-zone" id="holoZone">
      <img class="beam-img" id="beamImg" src="" alt="" />
      <div class="stack-wrap" id="stackWrap"></div>
    </div>
  </div>
  <div class="hint">
    v21 LED 기기 + 정면(0°) 상하 스택형 카드 전환 미리보기<br/>

const skinKeys = Object.keys(SKINS);
let skinIdx = 0, cardIdx = 0, holoOn = true, roomSub = 0;
const rooms = ["작업실 (WORK)", "거실 (LOUNGE)", "침실 (SLEEP)"];
const cards = [
  { id: "ROOMS", icon: HOLO.rooms, badge: () => rooms[roomSub],
    body: () => `<div class="room-box"><div class="mon">🫧<span>오이지</span></div><div class="mon">🐻<span>단무지</span></div><div class="mon">🎀<span>석박지</span></div><div class="mon">🦀<span>Claw.D</span></div></div><div class="row-item"><span>현재 공간</span><strong style="color:var(--holo)">${rooms[roomSub]}</strong></div>`,
    foot: "O: 방 전환 · < >: 상하 스택 회전" },
  { id: "MONS", icon: HOLO.mons, badge: () => "4 ACTIVE",
    body: () => `<div class="row-item"><span>🫧 오이지 (디자인·비서)</span><span style="color:var(--holo)">● 작업중</span></div><div class="row-item"><span>🦀 Claw.D (개발·코드)</span><span style="color:var(--holo)">● 작업중</span></div><div class="row-item"><span>🐻 단무지 · 🎀 석박지</span><span style="color:#94a3b8">○ 대기</span></div>`,
    foot: "O: 상태 새로고침" },
  { id: "USAGE", icon: HOLO.usage, badge: () => "LIVE",
    body: () => `<div class="row-item"><span>오이지</span><div class="bar-bg"><div class="bar-fill" style="width:68%"></div></div></div><div class="row-item"><span>Claw.D</span><div class="bar-bg"><div class="bar-fill" style="width:52%"></div></div></div><div class="row-item"><span>단무지</span><div class="bar-bg"><div class="bar-fill" style="width:24%"></div></div></div>`,
    foot: "최근 응답 시각 & 활동량" },
  { id: "SETUP", icon: HOLO.setup, badge: () => SKINS[skinKeys[skinIdx]].name,
    body: () => `<div class="row-item"><span>기기 스킨</span><strong style="color:var(--holo)">${SKINS[skinKeys[skinIdx]].name}</strong></div><div class="row-item"><span>홀로그램 글리치</span><span>ON (주사선 + 흔들림)</span></div><div class="row-item"><span>항상 위 고정</span><span>ON</span></div>`,
    foot: "O: 스킨 바로 바꾸기" }
];
document.getElementById("beamImg").src = HOLO.beam;
function applySkin() {
  const s = SKINS[skinKeys[skinIdx]];
  document.documentElement.style.setProperty("--holo", s.holo);
  ["baseImg","layerTopL","layerTopR","layerLeft","layerMid","layerRight"].forEach(id => { document.getElementById(id).src = s.src; });
  document.getElementById("skinBar").innerHTML = skinKeys.map((k, i) => `<button class="chip ${i===skinIdx?"active":""}" onclick="skinIdx=${i};applySkin();renderCards();">${SKINS[k].name}</button>`).join("");
}
function pressBtn(which, fn) {
  const map = { topL:"layerTopL", topR:"layerTopR", left:"layerLeft", mid:"layerMid", right:"layerRight" };
  const el = document.getElementById(map[which]);
  el.classList.add("pressed");
  setTimeout(() => el.classList.remove("pressed"), 110);
  fn();
}
function togglePower() { holoOn = !holoOn; document.getElementById("holoZone").classList.toggle("off", !holoOn); document.getElementById("lcdScreen").style.opacity = holoOn ? "1" : "0.25"; }
function nextSkin() { skinIdx = (skinIdx + 1) % skinKeys.length; applySkin(); renderCards(); }
function nextCard() { cardIdx = (cardIdx + 1) % cards.length; renderCards(); }
function prevCard() { cardIdx = (cardIdx - 1 + cards.length) % cards.length; renderCards(); }
function triggerAction() { if (cardIdx === 0) roomSub = (roomSub + 1) % rooms.length; else if (cardIdx === 3) { nextSkin(); return; } renderCards(); }
function renderCards() {
  const cur = cards[cardIdx];
  document.getElementById("lcdIcon").src = cur.icon;
  document.getElementById("lcdLabel").textContent = cur.id;
  document.getElementById("lcdDots").innerHTML = cards.map((_, i) => `<div class="lcd-dot ${i===cardIdx?"on":""}"></div>`).join("");
  document.getElementById("stackWrap").innerHTML = cards.map((c, i) => {
    const pos = (i - cardIdx + cards.length) % cards.length;
    return `<div class="holo-card pos-${pos}"><img class="holo-bg-img" src="${HOLO.frame}" /><img class="holo-hdr-img" src="${HOLO.header}" /><img class="holo-scan-img" src="${HOLO.scan}" /><div class="card-head"><div class="card-title-wrap"><img src="${c.icon}" />${c.id}</div><div class="card-badge">${c.badge()}</div></div><div class="card-body">${c.body()}</div><div class="card-foot"><span>${c.foot}</span><span>${i+1} / ${cards.length}</span></div></div>`;
  }).join("");
}
applySkin(); renderCards();
</script>
</body>
</html>
