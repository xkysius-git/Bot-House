name: Build Windows app
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: BotHouse-windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Attach build to a release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v1.0.0"
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Bot House $tag" --notes "Windows 설치본과 포터블 실행 파일입니다." --latest }
          gh release upload $tag dist/*.exe --clobber
