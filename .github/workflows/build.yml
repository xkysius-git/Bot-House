name: Build Windows app
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: BotHouse-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
      - name: Attach build to a release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 태그는 package.json 버전을 따라감 (1.0.2 → v1.0.2). 버전을 올려야 앱이 새 업데이트로 인식함.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if (-not (Test-Path dist/latest.yml)) { throw "dist/latest.yml 없음: 자동 업데이트가 동작하지 않음" }
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          Write-Host "Release $tag 업로드 파일:"; $files | ForEach-Object { Write-Host "  $_" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # 이미 배포된 버전은 덮어쓰지 않음 (같은 버전 번호에 다른 코드가 섞이는 것 방지). 새로 배포하려면 version을 올릴 것.
            Write-Host "$tag 릴리스가 이미 있어 업로드를 건너뜀. 빌드 결과는 Actions artifact에 있음."
            exit 0
          }
          gh release create $tag --target $env:GITHUB_SHA --title "Bot House $tag" --notes "Windows 설치본과 포터블 실행 파일입니다." --latest
          if ($LASTEXITCODE -ne 0) { throw "release 생성 실패" }
          gh release upload $tag @files
          if ($LASTEXITCODE -ne 0) { throw "release 업로드 실패" }
